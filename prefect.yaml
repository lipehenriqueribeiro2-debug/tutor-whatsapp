# prefect.yaml
name: tutor-whatsapp
prefect-version: 3.6.28

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/lipehenriqueribeiro2-debug/tutor-whatsapp.git
      branch: main

install:
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ build_working_directory }}"
      requirements_file: requirements.txt

deployments:
  - name: deploy-relatorio-domingo
    version: "1.0"
    tags: ["whatsapp", "tutor", "serverless", "bi"]
    description: "Gera e envia o planejamento estratégico da semana."
    entrypoint: rotinas_background.py:fluxo_relatorio_semanal
    work_pool:
      name: tutor-managed
      work_queue_name: default
    schedules:
      - cron: "0 9 * * 0" # Todo domingo às 09:00
        timezone: "America/Bahia"

  - name: deploy-monitor-infra
    version: "1.0"
    tags: ["whatsapp", "devops", "serverless"]
    description: "Verifica o saldo do OpenRouter e alerta se estiver baixo."
    entrypoint: rotinas_background.py:fluxo_monitoramento_infra
    work_pool:
      name: tutor-managed
      work_queue_name: default
    schedules:
      - cron: "0 8 * * *" # Todos os dias às 08:00
        timezone: "America/Bahia"

  - name: deploy-lembrete-estudo
    version: "1.0"
    tags: ["whatsapp", "ufba", "serverless"]
    description: "Dispara o aviso de foco para os estudos e relatórios."
    entrypoint: rotinas_background.py:fluxo_estudo_diario
    work_pool:
      name: tutor-managed
      work_queue_name: default
    schedules:
      - cron: "30 19 * * 1-5" # Segunda a Sexta às 19:30
        timezone: "America/Bahia"