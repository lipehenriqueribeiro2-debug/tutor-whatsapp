# prefect.yaml
name: tutor-whatsapp
prefect-version: 3.0.0

# Define o pool de recursos que vai executar essas tarefas
build: null
push: null
pull:
- prefect.deployments.steps.set_working_directory:
    directory: C:\Projetos-Python\tutor_whatsapp

deployments:
  - name: deploy-relatorio-domingo
    description: "Gera relatorio analitico semanal via Claude"
    entrypoint: rotinas_background.py:fluxo_relatorio_semanal
    work_pool:
      name: worker-tutor
    schedules:
      - cron: "0 18 * * 0"
        timezone: "America/Sao_Paulo"

  - name: deploy-monitor-apis
    description: "Monitora os limites de uso e infraestrutura"
    entrypoint: rotinas_background.py:fluxo_monitoramento_infra
    work_pool:
      name: worker-tutor
    schedules:
      - cron: "0 */6 * * *"
        timezone: "America/Sao_Paulo"

  - name: agendamento-estudo-diario
    version: "1.0"
    tags: ["estudos", "engenharia"]
    description: "Lembrete diário focado nos estudos universitários."
    entrypoint: "rotinas_background.py:fluxo_estudo_diario"
    work_pool:
      name: "worker-tutor"
      work_queue_name: "default"
    schedules:
      - cron: "0 19 * * *" # Padrão: Todos os dias às 19h
        timezone: "America/Sao_Paulo"