[project]
name = "tutor-whatsapp"
version = "0.1.0"
description = "Tutor Inteligente de Engenharia via WhatsApp com Roteamento Dinâmico"
authors = [
    { name = "Seu Nome", email = "seu_email@exemplo.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Framework Web ---
    "fastapi",
    "uvicorn",
    # --- Integrações Principais ---
    "twilio",
    "litellm",
    "prefect>=3.0.0",
    # --- Utilitários e Variáveis de Ambiente ---
    "python-dotenv",
    "requests",
    # --- Processamento de Mídia e Documentos ---
    "pillow",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
